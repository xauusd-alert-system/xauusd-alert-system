[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True

# --- Lint scope: exclude throwaway/operational surfaces from the report ---
exclude = (?x)(
    ^scripts/.*
    | ^tests/.*
    | ^_tmp_.*
    | ^htmlcov/.*
  )

# simulation/ is pure test scaffolding — the fake MetaTrader5 package injected
# onto sys.path. `exclude` does not stop mypy from following imports into it
# (mt5_adapter/lazy.py falls back to a dotted import), so silence it outright
# like a third-party dependency. Its typing surface mirrors the real package
# and is asserted by the test suite, not by mypy.
[mypy-simulation.*]
ignore_errors = True

# --- Third-party libraries: stubs are incomplete/absent ---

[mypy-pytest]
ignore_missing_imports = True

[mypy-numpy]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-xgboost]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-sklearn]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-joblib]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

# Windows-only MetaTrader5 package: not installable on ubuntu CI runners
[mypy-MetaTrader5]
ignore_missing_imports = True

[mypy-fastapi]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-statsmodels]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True
