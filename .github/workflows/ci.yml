name: CI

# Runs the test suite on every push to master and on every pull request so that
# dependency drift or a regression is caught automatically rather than only on a
# maintainer's machine.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy==2.5.1 (and the rest of the pinned stack) requires Python >= 3.12.
        python-version: ["3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 is guarded by a platform marker in requirements.txt, so it
          # is skipped on Linux; the tests exercise the MT5 shim instead.
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q
