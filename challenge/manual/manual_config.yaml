# Hash Hedge US Stocks Headliners — analysis-only runtime configuration.
# All times are the user's terminal time (UTC+4). Confirm the displayed terminal
# countdown before each session because published general documentation can differ.
workflow: analysis_only
market: us_stocks_headliners
account_size_usd: 1000.0

# Populate manually at preparation time with one to three liquid Headliners from
# the terminal. An empty list is intentionally a safe no-scan default.
watchlist: []
max_watchlist_size: 3
max_open_positions: 1

session_timezone_offset_minutes: 240
session_start_local: "18:30"
session_end_local: "00:55"
manual_flatten_local: "00:50"
no_entry_first_minutes: 15
entry_cutoff_minutes: 90
minimum_minutes_to_close: 45

# The operator records the date-specific earnings/CPI/FOMC red-zone list before
# the session. If calendar status is unknown, the manual workflow must stay NO-GO.
news_red_zone_local: []
news_buffer_minutes: 30
calendar_status: "unknown"

# Day-quality filters. Values remain hypotheses until causal replay validates them.
atr_min_ratio: 0.70
atr_max_ratio: 2.50
impulse_range_min_multiple: 1.50
impulse_volume_min_multiple: 1.30
trend_ema_period: 20
trend_slope_bars: 6
pullback_min_ratio: 0.382
pullback_max_ratio: 0.618
stop_atr_buffer_multiple: 0.50
signal_volume_min_multiple: 0.80

# Manual position-management specification. The software may report the planned
# levels but must never place or change these orders in a terminal.
outcome_plan:
  first_target_r: 1.0
  first_target_fraction: 0.50
  move_remainder_to_break_even: true
  final_target_r: 2.0
  manual_flatten_required: true

# Default risk profile from the updated TЗ. Profile A requires an explicit human
# confirmation plus a stage profit buffer in the risk engine.
default_stage: 1
default_profile: B
reference_balance: 1000.0
alert_poll_seconds: 30

# No terminal credentials, browser profile, order-routing or pair-alert settings
# belong in this file. Alerts are informational only and cannot submit orders.
