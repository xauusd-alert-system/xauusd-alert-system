  # Independent-axis volatility additions (2026-08-20): quantum (IONQ/QBTS),
  # nuclear (OKLO), fintech (HOOD), AI-audio (SOUN), satellite (ASTS),
  # hydrogen (PLUG) — борются с концентрацией watchlist в крипто-майнерах.
  - IONQ
