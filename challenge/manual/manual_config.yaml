news_red_zone_utc: []   # e.g. ["13:30", "14:30"] — red-zone events (UTC), +/-30 min buffer
session_start_utc: "13:30"
session_end_utc: "19:55"
# Фильтр "мёртвого дня" (ТЗ §4.1): размах сегодня vs прошлых сессий за то же
# прошедшее время. Ниже порога — NO-GO: на 24 неделях бэктеста ~100% убытков
# стратегии сконцентрированы на днях с atr_ratio < 0.7 (2026-08-21).
atr_min_ratio: 0.70
atr_max_ratio: 2.5
# Мёртвая зона сигнала (2026-08-21, 411 сетапов за 24 недели на 3.5R-исходах):
# сигналы на 60-69-й минуте после открытия — единственный устойчиво
# отрицательный бакет (avgR −0.324, n=44; соседи 50-59: +0.856, 80-89: +1.014).
# Исключение зоны даёт avgR +0.295 → +0.370, темп без изменений (~20 дней при
# $5), все кварталы положительные, устойчивость к топ-сделкам лучше (+0.189
# против +0.131 без фильтра).
signal_dead_zone: [60, 69]
# План выхода (2026-08-21, 411 сетапов за 24 недели): ВСЯ позиция едет до тейка,
# стоп −1R, иначе закрытие EOD 19:55. Дальний тейк +3.5R даёт avgR +0.295 против
# −0.021 у «50% на 1R → BE → 2R» (частичная фиксация обрезала победителей).
# «Без тейка» (+0.332) лучше сыро, но держится на 20 хвостовых сделках (+0.009
# без них) — 3.5R устойчив к этому (+0.132 без топ-20).
target_rr: 3.5
# S/R proximity filter (2026-08-22, us_stocks audit §5.2): reject signals
# too close to key support/resistance zones. $2 buffer balances quality vs
# quantity: 71% of weak signals filtered, 96% correctly identified near zones.
# AUDIT B 2026-08-23: price-scaled S/R buffer (% of entry price) — the flat
# $2 buffer covered ±700% of CAN's price and blocked every setup there.
sr_proximity_buffer_pct: 0.3

# GAP FADE setup (2026-08-24): fade the opening gap, orthogonal edge.
# Gap must exceed min_pct from previous-day close.
# Stop beyond the gap extreme, target = previous close.
gap_fade_min_pct: 0.005
gap_fade_stop_pct: 0.005

# OPENING DRIVE setup (2026-08-24): first N minutes direction drive.
# Body ratio must exceed min_body * range for a clean drive signal.
# Independent of trend/pullback — simpler gates, more signals.
opening_drive_minutes: 5
opening_drive_min_body: 0.5

# Анти-корреляционные кластеры: максимум ОДНА позиция из кластера в день
# (12 из 18 тикеров ходят за биткоином — без капа «3 сделки» превращаются
# в одну тройную ставку).
clusters:
  crypto_beta:
    - CAN
    - BTBT
    - HIVE
    - WULF
    - IREN
    - MARA
    - CIFR
    - CORZ
    - CLSK
    - RIOT
    - MSTR
    - COIN

# Календарь отчётностей: символ блокируется в день отчёта и на следующий
# день (гэп). Заполнение: python -m challenge.manual.run earnings add ...
earnings_calendar_path: challenge/manual/earnings_calendar.yaml
earnings_block_days: 2
default_stage: 1
# Профиль A, риск $5 (2026-08-21): при безлимитном времени челленджа MC 40k
# прогонов даёт P(провала −$100)=0 на любом риске (пауза + скейлинг держат дно).
# $5 — оптимум темпа: медиана ~20 дней (69% за месяц) при пауза-зоне лишь в ~6%
# прогонов; дальше $7+ темп не растёт, а простой по паузе душат. Грейд A/B по-
# прежнему не фильтрует (only_a: False везде).
default_profile: A
reference_equity: 1000.0
alert_poll_seconds: 30

# Pair signals (pairs_analysis модуль, ТЗ §4.4-§4.5)
# Опрашивает PairAnalyzer + SignalEngine на H1, шлёт алерт при MEAN-REV.
# Независимо от US-сессии: крипта 24/7, forex — свои часы.
pair_alerts:
  enabled: true
  pairs: ["XAU/XAG", "BTC/ETH", "BTC/SOL"]  # какие пары мониторить
  timeframe: H1                                  # H1 — больше сделок, кэш ускоряет до ~8s
  poll_minutes: 55                               # интервал опроса (<=60, чтобы не пропустить H1-бар)
  alert_cooldown_hours: 23                       # дедуп: один алерт на пару в сутки