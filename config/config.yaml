deployment:
  # Formal safety state; DRY_RUN is no longer the deployment authority.
  mode: research  # simulation | research | paper | human_confirmed | demo_systematic | live_systematic
  live_approval_id: null
  require_telegram_admin_for_execution: true

strategy:
  spec_path: config/strategy_spec.yaml
  version: xauusd-system-v3-signalbar-2026-08-16

ensemble:
  min_confidence_to_alert: 0.60
  # W15 (audit 2026-08-10): these probabilities were previously hard-coded
  # defaults inside model/ensemble.py with no entry in config.yaml, so the
  # thresholds that decide the flow of trades were invisible and not reproducible
  # across machines. Now declared here (defaults equal the old hard-coded values).
  #   min_ml_probability      - bare ML-probability floor for a day signal
  #   ml_confidence_floor     - p_max mapped to confidence: 0.50 -> 0.0, floor -> 1.0
  #   crypto_night_min_probability - elevated bar for BTC in the Asia session
  min_ml_probability: 0.55
  ml_confidence_floor: 0.62
  crypto_night_min_probability: 0.58
  min_regime_confidence: 0.60
  use_news_guard: true
  news_buffer_before_min: 30
  news_buffer_after_min: 30
  news_feed_failure_policy_live: fail_closed
  news_feed_max_age_minutes: 360
  historical_news_calendar_path: null  # dated CSV: timestamp_utc,title,country,impact
  # W14 (audit 2026-08-10): the news guard is enforced in the live trading path,
  # but backtest bars older than ~7 days are skipped by is_news_red_zone() because
  # there is no HISTORICAL economic-calendar feed. So backtests do not model news
  # impact for most of the sample (live does). This is an inherent data-source
  # limitation, not a code bug; record it when comparing live vs backtest trade
  # counts/tails. Enable `apply_news_guard_in_backtest` only if you wire in a
  # historical calendar feed.
  apply_news_guard_in_backtest: false
  # W17 (audit 2026-08-10): OPTIONAL macro sentiment veto that wires
  # data/sentiment_analyzer.py into the trading path (it previously only surfaced
  # in the dashboard). Default OFF preserves the exact baseline behaviour; enable
  # only after validating that the lexicon veto does not hurt live results.
  use_sentiment_guard: false
  sentiment_veto_threshold: 0.5
  # W16 (audit 2026-08-10): cross-asset comparability caveat. The per-asset
  # `min_confidence_to_alert` (0.70/0.85/0.60/...) is applied to a BLENDED
  # confidence whose scale differs by asset, and 3-class models (GBP) leave
  # residual mass on a no_trade class, so an absolute threshold like "0.85" is
  # NOT a probability and is not directly comparable across assets. Tuning is
  # per-asset on purpose; keep each asset's bar calibrated on ITS OWN signal
  # distribution. `model.normalize_probs` can force p_long+p_short=1 for the
  # 3-class path if you want a common probability scale (changes which signals
  # fire -> revalidate before enabling).
  suppress_regimes:
    - compression
    - reversal_watch
  suppress_sessions:
    - asia
    - off_session
  rule_weight: 0.20
  ml_weight: 0.80
  # Phase 2: EV-threshold entry gate. EV = p_exit_right * |reward| - (1 - p_exit_right)
  # * |risk| where p_exit_right = directional probability (p_long for long, p_short for
  # short), reward = the TP3 distance and risk = the stop distance from the signal grid
  # (signal_grid.tp3_mult / stop_mult; under the equal-step spec 3/3 = 1.0, i.e. the gate
  # is a pure probability-quality filter: p must exceed 0.5 + threshold/2 to pass).
  # When enabled (> 0) a signal only reaches "long"/"short" if the expected value of
  # (reward * p - risk * (1 - p)) / risk exceeds this threshold; otherwise it is declined
  # as no_trade. A value of 0 (the default) disables the gate so the Phase-0+1 baseline
  # is unchanged unless explicitly enabled for Phase 2 experiments.
  ev_threshold: 0
  # Phase 5 (#16): enforce p_long + p_short = 1 BEFORE any downstream use. Some
  # predictors (e.g. a 3-class model) leave the residual mass on a "no_trade" class,
  # so the two directional masses don't sum to 1 and would under/over-state confidence
  # and the EV gate. When true, the pair is re-scaled to sum to exactly 1.0 (a
  # degenerate total -> neutral 0.5/0.5, which can never pass any filter). Default
  # false preserves the exact Phase-0+1 behaviour.
  normalize_probs: false
  # Phase 4 (#30): per-asset dynamic min_confidence scaling. When true, the effective
  # alert bar is base * dynamic_min_confidence_scale (per-asset, default 1.0) *
  # (1 - min(dynamic_edge_credit, |p_long - p_short| * dynamic_edge_gain)) so each
  # asset tightens its OWN bar via dynamic_min_confidence_scale and weak-edge signals
  # need more evidence (fewer, better trades) while strong-edge signals are admitted.
  # Default false keeps the exact Phase-0+1 per-asset bar (static per-asset values in
  # each asset's ensemble section).
  dynamic_min_confidence: false
  dynamic_min_confidence_scale: 1.0
  dynamic_edge_credit: 0.10
  dynamic_edge_gain: 2.0
  # Phase 4 (#41): rule-vs-ML divergence as a HARD VETO. When true, a non-zero rule
  # vote OPPOSING the ML vote (rule long vs ML short, or vice versa) forces no_trade
  # outright instead of the soft confidence collapse. A tie (ml_vote=0) is NOT a
  # divergence - the rule side may carry it (requires min_ml_probability upstream).
  # Default false keeps the Phase-0+1 soft-collapse behaviour.
  hard_divergence_veto: false


market_data:
  provider: mt5
  timeframe: M5
  closed_candles_only: true
  # N10 (audit 2026-08-10): MT5 bar timestamps are in the BROKER-SERVER timezone,
  # not UTC (FxPro EET/EEST = UTC+2/+3, and the offset floats across EU/US DST
  # transitions). When non-zero, the provider shifts raw server timestamps to true
  # UTC and adjusts range bounds accordingly, so session tagging / labeling / the
  # range tail-cut are not silently shifted. Default 0 preserves legacy behaviour
  # (server treated as UTC); set it to the measured broker offset once known.
  server_time_offset_hours: 0


general:
  db_path: data/market_data_mt5.sqlite


assets:
  XAUUSD:
    enabled: true
    mt5_symbol: GOLD
    display_name: XAU/USD
    model_path: output/models/xauusd_direction_model.joblib
    spread_usd: 0.25
    # Backtest-only slippage override in USD price units per side. Without an
    # override the global backtest.slippage_points=5 -> 0.05 price units was
    # applied to EVERY asset, which for low-priced FX (EURUSD ~1.08) is ~460
    # pips and instantly stopped every trade (0% win rate). Production uses MT5
    # deviation (20 pts, instrument-specific), never a global absolute slippage.
    slippage_usd: 0.05
    ensemble:
      # Recalculated 2026-08-12 for rule/ml 0.10/0.90 (was 0.15/0.85): bar 0.71
      # keeps the effective p_max admission cuts as close as possible to the old
      # semantics under the new blend (agree path 0.5777 -> 0.5816, rule-neutral
      # path 0.5988 -> 0.5949; +/-0.4pp minimax split). Note the bar applies to a
      # BLENDED score, so a weight change without a bar change silently moves both
      # cuts (at 0.70 kept: agree +0.24pp stricter, neutral -0.55pp looser).
      min_confidence_to_alert: 0.71
      suppress_sessions: [asia, off_session]
      suppress_regimes: [compression, reversal_watch]
      rule_weight: 0.10
      ml_weight: 0.90
    labeling:
      event: traded
    # Equal-step signal grid clamps (price points). Gold M5 ATR ~3-7 -> keep the
    # step inside 2..8 pts so extreme ATR cannot produce absurd TP/SL levels.
    signal_grid:
      step_min_points: 3.0
      step_max_points: 9.0
    # PRE-REGISTERED HYPOTHESIS (quant audit 2026-08-07, Claude plan action 1):
    # M5 -> M15 if cost_ratio > 15% on the real DB (measure first:
    #   python -m scripts.diag_r_metrics --asset XAUUSD --timeframe M5
    #   python -m scripts.diag_r_metrics --asset XAUUSD --timeframe M15
    # cost_ratio = (spread + 2*slippage + commission_price) / mean_step;
    # norm < 8-10%, red zone > 15%. Step scales ~sqrt(3) while costs are
    # fixed, so net expectancy multiplies. Everything else stays frozen.
    # CONFIRMED on the real DB (2026-08-07 measurements): M5 cost_ratio 15.6%
    # (RED) -> M15 6.1% (OK), E[R] preserved (0.074 vs 0.076).
    timeframe: M15


  XAGUSD:
    # Quant audit 2026-08-07: XAGUSD moved to SHADOW (enabled: false).
    # Rationale: PF_med ~0.91 (< 1), only 6/14 positive walk-forward folds —
    # the positive aggregate PnL is concentrated in a few periods; combined
    # with ~0.84 spot correlation to XAU the asset is not a diversifier.
    # Research continues via explicit --asset scripts (run_backtest,
    # deflated_sharpe, exit_profile); return to live only if outer-OOS shows
    # dSharpe >= +0.10 vs the 4-asset portfolio or ES95/maxDD improves >= 10%.
    enabled: false
    mt5_symbol: SILVER
    display_name: XAG/USD
    model_path: output/models/xagusd_direction_model.joblib
    # Per-asset timeframe: M15 (global default is M5). M5 step is too small
    # relative to fixed spread+slippage on silver (~25% of TP1); M15 makes the
    # grid ~2-2.5x wider so transaction costs eat far less of the target.
    timeframe: M15
    spread_usd: 0.02
    slippage_usd: 0.02
    # Contract multiplier: 1.0 lot = 5000 troy oz -> $1 price move = $5000/lot,
    # so 0.01 lot = $50 per price unit. The global default point_value_lot=100 is
    # a GOLD multiplier; without a per-asset override XAG/EUR/GBP PnL was scaled
    # ~100x too small, the flat $0.07 commission swamped every trade and the
    # winning trades were invisible (win_rate collapsed to ~0% even after the
    # slippage fix). XAUUSD keeps the default (100 = correct gold multiplier);
    # BTCUSD keeps the default to preserve its valid, uncorrupted baseline.
    point_value_lot: 5000
    ensemble:
      min_confidence_to_alert: 0.75
      suppress_sessions: [asia, off_session]
      suppress_regimes: [compression, reversal_watch]
      rule_weight: 0.15
      ml_weight: 0.85
    signal_grid:
      step_min_points: 0.1
      step_max_points: 1.0


  BTCUSD:
    enabled: true
    mt5_symbol: BITCOIN
    display_name: BTC/USD
    model_path: output/models/btcusd_direction_model.joblib
    spread_usd: 3.00
    # No slippage_usd override: BTC is high-priced (~50k), so the global default
    # (slippage_points=5 -> 0.05 price units) is negligible there and the prior
    # BTCUSD baseline was NOT corrupted by the FX unit-mismatch bug. Keeping the
    # default preserves that valid baseline instead of re-costing it.
    # Contract multiplier: 1.0 lot = 1.0 BTC -> $1 price move = $1/lot, so
    # 0.01 lot = $0.01 per price unit. The global default point_value_lot=100 is
    # a GOLD multiplier and would have inflated BTCUSD money-PnL 100x (+$377k
    # fake baseline -> the same class of unit bug fixed for FX/XAG above);
    # `1` is the standard MT5 BTCUSD contract size (matches simulation
    # symbol_overrides BTCUSD=1.0).
    point_value_lot: 1
    ensemble:
      # Entry parameters (owner request 2026-08-11, "adapt BTC entry to current
      # market"). These per-asset overrides make the BTC entry bar explicit and
      # tunable against the current high-vol regime instead of silently inheriting
      # the global values. The signal-quality floor is raised (fewer, higher
      # conviction entries) and the crypto-night bar is kept strict. Validate on
      # live data and re-run the decision gate before committing capital; do NOT
      # tune these from a single fresh snapshot.
      # Recalculated 2026-08-12 for rule/ml 0.10/0.90 (was 0.20/0.80): bar 0.68 is
      # the minimax-equivalent of the old 0.66 under the new blend (agree p_max
      # cut 0.6035 -> 0.6160, rule-neutral 0.6485 -> 0.6360; +/-1.25pp split).
      # Keeping 0.66 with the new weights would have made the trend-agree path
      # +0.85pp stricter and the rule-neutral path -1.65pp looser.
      min_confidence_to_alert: 0.68
      min_ml_probability: 0.60
      ml_confidence_floor: 0.68
      crypto_night_min_probability: 0.62
      ev_threshold: 0.05
      suppress_sessions: []
      suppress_regimes: [compression, reversal_watch]
      rule_weight: 0.10
      ml_weight: 0.90
    signal_grid:
      step_min_points: 20.0
      step_max_points: 50.0
    # PRE-REGISTERED HYPOTHESIS (quant audit 2026-08-07, Claude plan action 1):
    # M5 -> M15 if cost_ratio > 15% on the real DB (measure first with
    #   python -m scripts.diag_r_metrics --asset BTCUSD --timeframe M5|M15
    # norm < 8-10%, red zone > 15%. Everything else stays frozen.
    # CONFIRMED on the real DB (2026-08-08 measurements): BTC M5 cost_ratio
    # 8.1% (OK) -> timeframe stays M5 (hypothesis rejected).
    # timeframe: M15


  EURUSD:
    # FX v3: H1 + early breakeven (0.5 step) + tighter stop (2.0 step) to cut
    # the 3x-step loss tail that made M15 unprofitable (WR 62% cannot pay for
    # a 1:3 grid).
    enabled: true
    mt5_symbol: EURUSD
    display_name: EUR/USD
    model_path: output/models/eurusd_direction_model.joblib
    # H1: on M5 the round-trip cost (~5 pips) is ~100% of the TP1 step, so the
    # trade cannot pay for itself; M15 was still unprofitable (mean-reverting
    # 1:3 grid), H1 widens the grid further AND early-breakeven + stop 2.0 cut
    # the loss tail (see docs/FX_V3.md).
    timeframe: H1
    spread_usd: 0.00012
    slippage_usd: 0.0002
    # 1.0 lot = 100,000 base units (pip ~= $10/lot) -> 0.01 lot = $1000 per price
    # unit. See XAGUSD comment: the global default 100 left FX money-PnL ~1000x
    # too small, so the flat commission dominated and every trade showed -0.07.
    point_value_lot: 100000
    ensemble:
      min_confidence_to_alert: 0.85
      suppress_sessions: [asia, off_session]
      suppress_regimes: [compression, reversal_watch]
      rule_weight: 0.10
      ml_weight: 0.90
    labeling:
      horizon_candles_n: 48
      target_atr_multiplier: 1.2
      stop_atr_multiplier: 1.0
      atr_column: atr
      tp1_atr_multiplier: 1.0
      tp2_atr_multiplier: 1.8
      tp3_atr_multiplier: 2.8
    signal_grid:
      step_min_points: 0.0005
      step_max_points: 0.005
      stop_mult: 2.0
      breakeven_trigger_atr: 0.5


  GBPUSD:
    # FX v4 (trend-friendly) — FINAL GBPUSD config, result of the protected
    # grid-search (docs/GBP_FIX_STRATEGY.md). v3's early-BE package (BE 0.5,
    # stop 2.0) was tuned for mean-reverting EUR and CUT GBP's recoveries
    # (PF ~0.84). GBP is trending: give it room to run — wide stop (3.0), NO
    # early BE (BE only at TP1), further TP2 (2.5) and TP3 (3.0), lower conf
    # bar (0.80 -> 0.60 legacy adopted), horizon 36.
    enabled: true
    mt5_symbol: GBPUSD
    display_name: GBP/USD
    model_path: output/models/gbpusd_direction_model.joblib
    # H1 (or H4 candidate). See docs/GBP_FIX_STRATEGY.md
    timeframe: H1
    spread_usd: 0.00015
    slippage_usd: 0.0002
    point_value_lot: 100000
    ensemble:
      min_confidence_to_alert: 0.60
      suppress_sessions: [asia, off_session]
      suppress_regimes: [compression, reversal_watch]
      rule_weight: 0.10
      ml_weight: 0.90
    labeling:
      horizon_candles_n: 36
      target_atr_multiplier: 1.2
      stop_atr_multiplier: 1.0
      atr_column: atr
      tp1_atr_multiplier: 1.0
      tp2_atr_multiplier: 1.8
      tp3_atr_multiplier: 2.8
    signal_grid:
      step_min_points: 0.0005
      step_max_points: 0.006
      stop_mult: 3.0
      breakeven_trigger_atr: 1.0
      tp2_mult: 2.5
      tp3_mult: 3.0
      # Per-regime exit policy — ENABLED (post-measurements TZ 2026-08-07, step 3).
      # Adopted as `current` from the pre-registered regime_wide variant after
      # the real-DB run: regime_wide PF 1.31 vs legacy current 1.20
      # (n≈529, PnL≈+85); regime_fast measured harmful (-60.6) and is NOT used.
      # The audit's law: trend regimes run WIDE (no early BE, far targets,
      # back-loaded scaleout 30/30/40), range regimes manage FAST (early BE,
      # tight stop, front-loaded 60/40). Note: even with PF 1.31 the decision
      # gate stays FAIL (cost-stress PF 0.97) -> GBP remains paper/shadow.
      regime_overrides:
        trend_up:
          stop_mult: 4.0
          breakeven_trigger_atr: 1.0
          tp2_mult: 2.5
          tp3_mult: 4.0
          scaleout: {tp1_ratio: 0.3, tp2_ratio: 0.3}
        trend_down:
          stop_mult: 4.0
          breakeven_trigger_atr: 1.0
          tp2_mult: 2.5
          tp3_mult: 4.0
          scaleout: {tp1_ratio: 0.3, tp2_ratio: 0.3}
        range:
          stop_mult: 2.0
          breakeven_trigger_atr: 0.5
          scaleout: {tp1_ratio: 0.6, tp2_ratio: 0.4}
    # Stage 4: per-asset model flags (use_regime_feature / include_zero_class)
    model:
      use_regime_feature: true
      include_zero_class: true
    # v4b trailing candidate (code path implemented in ensemble_backtest +
    # mt5_trader; NOT enabled): after TP1+TP2 the 20% remainder is trailed at
    # trailing*ATR instead of the fixed TP3.
    # signal_grid:
    #   trailing_atr_mult: 2.0
    #   stop_mult: 3.0
    #   breakeven_trigger_atr: 1.0


alerts:
  cooldown_minutes: 15
  max_alerts_per_day: 30
  # Append a compact metadata line (Conf / Regime / Session) to Telegram
  # signals. Default false keeps the clean ШОРТ/ЛОНГ layout from the spec.
  include_signal_meta: false


features:
  ema_periods: [9, 21, 50, 200]
  rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  atr_period: 14
  bollinger:
    period: 20
    std_dev: 2.0
  structure_lookback: 20
  mtf_reference_timeframes: ["M15", "H1"]


regime:
  min_candles_for_regime: 50
  no_trade_volatility_floor: 0.0001
  atr_spike_multiplier: 1.8
  bb_width_compression_pctile: 20
  adx_trend_threshold: 20


model:
  random_seed: 42
  calibration_method: sigmoid
  # Production and calibration use the same index-aligned average-uniqueness
  # weights. Set either mode to `none` only for an explicit controlled A/B.
  sample_weight_mode: uniqueness       # uniqueness | none
  calibration_weight_mode: same_as_training  # same_as_training | none
  train_ratio: 0.8
  type: xgboost          # xgboost | random_forest | lightgbm | ensemble
  ensemble_method: soft_voting
  # Phase 2 (3-class model): when true, label 0 ("no clear outcome" inside the
  # labeling horizon) is kept as a THIRD class instead of being dropped, so the
  # model can explicitly express "no edge". y is encoded {0: short, 1: no_trade,
  # 2: long} and ModelPredictor.predict_proba detects the 3-class model and still
  # exposes p_short / p_long (p_no_trade = residual mass). Default false preserves
  # the exact Phase-0+1 two-class baseline. NOTE: when enabled, retraining from
  # real executed trades is skipped (real trades are only binary outcomes and
  # cannot be merged into the 3-class label space without corrupting it).
  include_zero_class: false
  # Phase 3 (regime as categorical model feature): when true, the rule-based
  # regime label (trend_up / trend_down / range / compression / reversal_watch /
  # no_trade) is expanded into one-hot columns (regime_<label>) and added to the
  # training features so the model can learn regime-conditional behavior directly
  # (rather than only via the ensemble meta-filter). Default false preserves the
  # exact Phase-0+1 / Phase-2 feature set. One-hot columns are synthated at
  # training time in build_training_matrix and re-synthesized at inference time by
  # ModelPredictor from the raw `regime` column, so all consumers work unchanged.
  use_regime_feature: false


# ---------------------------------------------------------------------------
# TRAINING target contract (labeling/label_generator.py). `barrier` preserves the
# legacy triple barrier globally; an asset may explicitly opt into `traded`, which
# resolves that asset's execution grid/cost event. Production retraining merges
# assets.<KEY>.labeling before labeling and records this version/hash in the model
# bundle. Never change an event on the basis of locked/live-forward data.
# ---------------------------------------------------------------------------
labeling:
  contract_version: 2
  event: barrier           # barrier | traded (per-asset opt-in allowed)
  method: atr_scaled
  horizon_candles_n: 36
  target_atr_multiplier: 1.2
  stop_atr_multiplier: 1.0
  atr_column: atr
  tp1_atr_multiplier: 1.0
  tp2_atr_multiplier: 1.8
  tp3_atr_multiplier: 2.8


# ---------------------------------------------------------------------------
# Signal grid spec for Telegram (alerts/formatter.py, realtime/pipeline.py).
# ASYMMETRIC grid (owner request 2026-08-11): step = step_points (if set) else
# 1.0 * ATR, clamped to [step_min_points, step_max_points]; TP1 = entry ± 1*step,
# TP2 = ±1.5*step, TP3 = ±2*step, Stop = entry ∓ 2*step (risk:TP3 = 1:1,
# BE on TP1). This is TIGHTER than the previous equal-step (2/3/3) grid so
# profits are banked faster and per-trade risk (stop distance) is reduced, at
# the cost of giving winners less room. Per-asset overrides live in
# assets.<key>.signal_grid; assets that override mults (EUR stop 2.0, GBP 3.0
# with regime overrides) keep their own deliberately-tuned values.
# NOTE: this changes live TP/SL distances — re-run backtests before trusting
# new numbers (see docs/benchmarks.md).
# ---------------------------------------------------------------------------
signal_grid:
  tp1_mult: 1.0
  tp2_mult: 1.5
  tp3_mult: 2.0
  stop_mult: 2.0
  # Early breakeven: move the stop to entry once price reaches this fraction
  # of the TP1 distance in our favor. 1.0 = legacy (BE only when TP1 hits);
  # values < 1.0 (e.g. 0.5) protect mean-reverting assets (FX) from the
  # 3x-step loss tail by converting most would-be losers into scratches.
  breakeven_trigger_atr: 1.0
  step_points: null        # fixed step in price points; null = dynamic 1.0*ATR
  step_min_points: null    # lower clamp (null = no clamp)
  step_max_points: null    # upper clamp (null = no clamp)


sessions:
  asia: {start: 0, end: 8}
  london: {start: 8, end: 13}
  newyork: {start: 13, end: 22}


backtest:
  spread_points: 25
  slippage_points: 5
  commission_per_trade: 0.07
  swap_per_night: 0.0
  initial_balance: 100.0
  volume: 0.10
  max_daily_loss_pct: 5.0
  risk_per_trade_pct: 2.0
  walk_forward:
    train_window_days: 300
    test_window_days: 50
    step_days: 50
    # W3 (audit 2026-08-10): extra embargo buffer (in candles) dropped from the
    # tail of each train window on top of the labeling-horizon purge, to account
    # for serial correlation of features across the train/test boundary.
    embargo_candles: 100


# ===== RETRAINING =====
retraining:
  # SAFETY FREEZE (2026-08-16): signal-bar grid parity invalidated the old
  # baselines. Keep every automatic retraining path off until pre-lock A/B and
  # MTF revalidation are completed on the copied DB.
  enabled: false
  # Executed trades are policy-selected and win/loss is not an unconditional
  # direction label. Keep them for monitoring until a debiasing contract is
  # pre-registered; production retraining uses historical event labels only.
  real_trade_merge_enabled: false
  retrain_on_startup: false
  max_age_hours: 24
  download_data: true
  lookback_days: 730
  assets: ["XAUUSD", "XAGUSD", "BTCUSD", "EURUSD", "GBPUSD"]
  schedule:
    enabled: false
    day_of_week: "monday"
    hour: 3
    minute: 0


# ===== DEPLOY GUARD (Part B Phase 6 / audit #25) =====
# The nightly retrain must never silently overwrite a good production model with
# a bad one. scripts/overnight.py stage 4 wraps its retrain_with_real_trades call
# with scripts/deploy_guard.py:
#   --backup   backs up each enabled asset's current model to `<model_path>.deploy_guard.bak`
#              BEFORE the nightly retrain overwrites it.
#   --check    after the retrain, walk-forward validates the newly trained model
#              against the backed-up incumbent on the SAME freshly backfilled
#              out-of-sample windows; if it regressed beyond `tolerance` (or has
#              too little OOS evidence, per `min_trades`), the incumbent is
#              restored and the stage exits 1 -> overnight reports FAILED (❌).
deploy_guard:
  enabled: true
  # Primary metric used to compare candidate vs incumbent on identical OOS
  # windows. Walked through `fallback_metrics` when it is missing/degenerate.
  primary_metric: expectancy
  fallback_metrics: [sharpe_ratio, win_rate, total_pnl]
  # Minimum OOS trades for a side's metric to be trusted. A candidate with
  # fewer than this NEVER replaces an incumbent that has enough evidence.
  min_trades: 20
  # Allowed degradation (>= 0) of the candidate vs the incumbent on the primary
  # metric. 0.0 = the candidate must be at least as good (strictly conservative).
  tolerance: 0.0
  # Sidecar name used by --backup / --check.
  backup_suffix: ".deploy_guard.bak"


# ===== EXECUTION POSITION CONCURRENCY (quant audit Section 5.2B / Task 8) =====
# Explicit semantics:
# - per_asset: each single-asset engine (backtest/engine.py:14, model/ensemble_backtest.py:223)
#   maintains at most ONE open position at a time per asset.
# - global: account-level risk manager (execution/risk_manager.py:20) limits total concurrent
#   open positions across all instruments to max_concurrent_positions_global (default 3).
execution:
  # SAFETY FREEZE (2026-08-16): the causal signal-bar grid contract invalidates
  # every admission gate measured with entry-bar ATR, including BTCUSD. Empty is
  # an explicit deny-all list (mt5_trader distinguishes it from a missing key).
  # EURUSD/GBPUSD execution-quality probes remain separately guarded below.
  enabled_assets: []
  # Refuse model-driven execution on any non-demo terminal. Keep this true until
  # a separate, explicit real-money deployment review.
  require_demo_account: true
  # Autonomous execution-quality sample, not a signal strategy. The runner opens
  # and closes a 0.01-lot EURUSD/GBPUSD demo position after 2 seconds only during
  # London/NY, with a hard daily cap and spread ceiling. It also requires the
  # FX_PROBE_CONFIRM=YES environment safeguard before sending anything.
  fx_execution_probes:
    enabled: true
    assets: [EURUSD, GBPUSD]
    volume: 0.01
    hold_seconds: 2
    min_interval_minutes: 120
    max_probes_per_asset_per_day: 4
    max_spread_pips: {EURUSD: 0.8, GBPUSD: 1.2}
    log_path: logs/fx_execution_probes.csv
  max_open_positions_mode: per_asset  # per_asset | global
  max_open_positions_per_asset: 1
  max_concurrent_positions_global: 3
  # Daily cap on NEW trades per asset (circuit-breaker budget). Read by
  # execution/risk_manager.py (W8) instead of a hard-coded 10.
  max_daily_trades_per_asset: 10
  # Live order volume in lots. Read by execution/mt5_trader.py (W2) instead of a
  # hard-coded 0.01 that made the 50/30/20 scale-out unimplementable. When unset
  # it falls back to backtest.volume (default 0.10, which yields fillable
  # tranches 0.05 / 0.03 / 0.02).
  volume: 0.10
  signal_ranking_metric: confidence   # confidence | ev | probability


# ===== RISK ENGINE (quant audit 2026-08-07, Claude plan Q6) =====
# Pre-trade stop-risk sizing + exposure caps (priority 1), drawdown throttle
# (priority 3). DEFAULT OFF: enabling changes live order sizes, so it is a
# separate, audited step (execution/risk_sizer.py implements the math).
risk:
  enabled: true
  # fraction of equity risked per trade on a full stop-out (audit: 0.002-0.0025)
  risk_per_trade_pct: 0.0025
  # correlated-cluster stop-risk cap (fraction of equity)
  cluster_risk_cap: 0.004
  total_open_risk_cap: 0.0075
  # portfolio vol target (annualized) + leverage clip for vol targeting
  vol_target: 0.10
  leverage_lo: 0.5
  leverage_hi: 1.25
  # new same-direction signal in an exposed cluster -> size multiplier
  same_direction_multiplier: 0.35
  # drawdown throttle from high-water mark (fraction, multiplier)
  drawdown_throttle:
    - [-0.04, 0.75]
    - [-0.06, 0.50]
    - [-0.08, 0.0]
  min_lot: 0.1


# ===== LOCKED HOLD-OUT (quant audit 2026-08-07, Claude plan) =====
# A reserved period that RESEARCH must never look at. When enabled, every
# walk-forward runner (run_backtest / deflated_sharpe / grid_search) refuses
# to run if any of its test windows overlaps this range unless --allow-locked
# is passed (which burns the lock). Set it to the most recent ~12 months once
# the current research round is frozen; inspect it ONE time before deploy.
# SHIFTED (iteration TZ 2026-08-08, step 6): the 2025-06-01..2026-08-07 period
# was partially burned by --allow-locked during the measurement round, so an
# honest final test is only possible on NEW live-forward data. The lock now
# covers everything from 2026-08-08 onward (open-ended); new experiments must
# run on data BEFORE 2026-08-08 without --allow-locked.
validation:
  locked_holdout:
    enabled: true
    start: "2026-08-08"    # from today — live-forward accumulation
    end: null              # open-ended: research never looks at fresh data

# Frozen paper is a separate process and never routes orders. Paths may be
# overridden by PAPER_MANIFEST_PATH / PAPER_LEDGER_DB for /paper status.
paper_forward:
  enabled: false
  manifest_path: config/paper/xauusd_wide_trend_filtered.json
  ledger_db_path: data/paper_forward.sqlite
  min_closed_trades: 50
  outcome_metrics_visible_during_accumulation: false


# ===== CORRELATION FILTER (динамический) =====
correlation_filter:
  enabled: true
  # Порог абсолютного значения корреляции. Если |corr| >= threshold,
  # активы считаются коррелированными.
  threshold: 0.80
  # Количество M5-баров для расчёта корреляции (скользящее окно).
  history_bars: 500
  # Как часто пересчитывать матрицу корреляций (в минутах).
  update_interval_minutes: 60