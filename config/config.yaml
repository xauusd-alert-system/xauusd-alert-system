# ============================================================
# Master configuration for XAUUSD Predictive Alert System
# ALL thresholds, timeframes, and risk params live here.
# No module should hardcode a numeric threshold - reference this file instead.
# ============================================================

general:
  symbol: "XAUUSD"
  base_currency: "USD"
  timezone: "UTC"          # All internal timestamps are stored/processed in UTC
  db_path: "data/market_data.sqlite"
  log_db_path: "logs/signal_journal.sqlite"

timeframes:
  - "M1"
  - "M5"
  - "M15"
  - "H1"
  - "H4"

sessions:
  # Session windows defined in UTC hours [start, end)
  asia:   { start: 0,  end: 8 }
  london: { start: 7,  end: 16 }
  ny:     { start: 12, end: 21 }
  # Overlaps are intentional (e.g., London/NY overlap 12-16 UTC) and tagged as multi-session

features:
  ema_periods: [9, 21, 50, 200]
  rsi_period: 14
  macd: { fast: 12, slow: 26, signal: 9 }
  atr_period: 14
  bollinger: { period: 20, std_dev: 2.0 }
  structure_lookback: 20        # candles to look back for swing high/low detection
  mtf_reference_timeframes: ["M15", "H1", "H4"]  # used for confluence scoring on M5 base

regime:
  adx_trend_threshold: 25        # ADX above this = trending
  bb_width_compression_pctile: 20 # Bollinger width below this percentile = compression
  atr_spike_multiplier: 2.0      # ATR > N * rolling_mean(ATR) => reversal-watch flag
  min_candles_for_regime: 50      # warm-up period before regime classification is valid
  no_trade_volatility_floor: 0.0005  # ATR/price ratio below this => insufficient volatility

labeling:
  target_pips_x: 150      # "reach +X" in points (0.01 = 1 pip for XAUUSD, adjust per broker)
  stop_pips_y: 100         # "before -Y" in points
  horizon_candles_n: 24   # number of candles (on labeling timeframe) to evaluate outcome
  labeling_timeframe: "M15"

backtest:
  spread_points: 30        # assumed spread in points (broker-dependent, conservative default)
  slippage_points: 10      # assumed slippage per fill
  initial_balance: 500.0   # small capped deposit per risk context
  risk_per_trade_pct: 1.0  # % of balance risked per trade
  walk_forward:
    train_window_days: 3
    test_window_days: 1
    step_days: 1

model:
  algorithm: "xgboost"          # or "lightgbm"
  calibration_method: "isotonic" # or "sigmoid"
  train_test_split_ratio: 0.8
  random_seed: 42
  meta_filter:
    min_regime_confidence: 0.55
    suppress_regimes: ["range", "compression"]  # ML signals suppressed in these regimes unless rule-baseline agrees strongly

ensemble:
  weight_rule_based: 0.4
  weight_ml_probability: 0.6
  min_confidence_to_alert: 0.65   # matches target 65-80% accuracy band lower bound
  high_confidence_threshold: 0.75

alerts:
  telegram_min_confidence: 0.70   # only send alerts at/above this confidence
  cooldown_minutes: 30            # minimum time between two alerts to avoid spam
  max_alerts_per_day: 6

risk:
  max_daily_alerts: 6
  no_trade_default: true    # system defaults to NO TRADE unless all gates pass
