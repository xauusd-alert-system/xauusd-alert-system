version: '3.8'

services:
  usstocks-bot:
    build: .
    container_name: usstocks-bot
    restart: unless-stopped
    environment:
      - PROFILE=us_stocks_challenge
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - US_WATCHLIST=${US_WATCHLIST:-AMD,NVDA,TSLA,AAPL,META,MSFT}
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "usstocks.bot"]

  usstocks-health:
    build: .
    container_name: usstocks-health
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROFILE=us_stocks_challenge
      - HEALTH_SERVER_HOST=0.0.0.0
      - HEALTH_SERVER_PORT=8000
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "usstocks.health_server"]
