# TZ 6.7: docker-compose for the paper/alerts deployment.
#
# MetaTrader5 note: the image is Linux-based, so the Windows-only MetaTrader5
# wheel is excluded by the platform marker in requirements.txt. `bot` runs the
# virtual-simulator paper mode (scripts.run_bot + MT5 shim); it CANNOT reach a
# real MT5 terminal from inside a container — live trading stays on the
# Windows host (see deploy/ systemd units / scheduled tasks).
#
# Healthchecks:
#   * dashboard      — HTTP probe GET /api/health (enriched, TZ 6.3) on :8000.
#                      curl is not installed in the slim image, so a python
#                      one-liner with urllib is used instead.
#   * ledger_bridge / news_feed — HTTP probe GET /health (services/base.py)
#                      on their configured --health-port.
#   * bot            — scripts.run_bot serves no HTTP endpoint (Telegram
#                      long-polling + trading loop only), so the healthcheck
#                      verifies liveness via /proc/1/cmdline: the container's
#                      main process must still be the bot entrypoint. This is
#                      a process liveness check, not a functional probe —
#                      functional health for the pipeline lives in `dashboard`.

services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys; sys.exit(0 if b'run_bot' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "realtime.app:app",
              "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional sidecars: start with `docker compose --profile services up`.
  ledger_bridge:
    profiles: ["services"]
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["python", "-m", "services.ledger_bridge", "--health-port", "8791"]
    ports:
      - "8791:8791"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8791/health', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  news_feed:
    profiles: ["services"]
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["python", "-m", "services.news_feed", "--health-port", "8793"]
    ports:
      - "8793:8793"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8793/health', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
