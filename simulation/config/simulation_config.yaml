# ============================================================
# Simulation Configuration
# Defines the virtual limit order book (LOB) market simulation
# parameters used by MarketSimulator and the MT5 shim.
# ============================================================

# Starting mid price of the simulated market (XAU/USD level)
initial_price: 2400.0

# Simulation start time as a Unix UTC timestamp.
# 1700000000 = 2023-11-14 22:13:20 UTC — gives realistic bar timestamps
# instead of 1970-01-01 (Unix epoch 0).
start_timestamp_utc: 1700000000

# Time each tick represents (seconds). 5s per tick -> ~12 ticks per M1 bar.
tick_duration_seconds: 5

# Number of ticks that make up one M1 bar. 12 ticks of 5s = 1 M1 bar.
bar_interval_ticks: 12

# Number of ticks that make up one M5 bar. 60 ticks of 5s = 1 M5 bar
# (used by run_loop).
m5_bar_interval_ticks: 60

# ============================================================
# Agent population — rebalanced for directional price movement
#
# Previous:  noise=300, mm=20, trend=50,  mr=50,  fund=5
# Now:       noise=200, mm=20, trend=150, mr=20,  fund=20
#
# Rationale:
#   - Fewer noise traders -> less mean-reverting "wall of randomness"
#   - 3x more trend followers -> momentum builds and sustains
#   - 4x more fundamental agents -> stronger price discovery / drift
#   - Mean-reversion cut 60% -> price escapes equilibrium more easily
# ============================================================
num_noise_traders: 200
num_market_makers: 20
num_trend_followers: 150
num_mean_reversion: 20
num_fundamental: 20

# Noise trader order size distribution (lognormal)
noise_lambda: 0.3
noise_lognormal_mu: 1.5
noise_lognormal_sigma: 0.5
noise_min_size: 0.01
noise_max_size: 5.0

# Noise trader directional "tide": BUY probability oscillates as a sine wave
# between 0.5 - amplitude and 0.5 + amplitude.
# amplitude=0.30 -> swing from 20% to 80% buy probability (was 0.15 -> 35-65%)
# period=120 ticks -> ~10 min cycle (was 240 -> ~20 min), creating more frequent
# and stronger directional waves that push the mid price away from the initial level.
noise_imbalance_amplitude: 0.30
noise_imbalance_period_ticks: 120.0

# Market maker behaviour
mm_spread_offset_pct: 0.0005
mm_max_inventory: 100.0

# Fundamental/rebalance behaviour
# impact_factor=2.0 (was 0.5) — fundamental agents now punch hard enough to
# initiate multi-bar directional moves, not just dampen noise.
# drift_pct=0.0003 introduces a slow random-walk drift (~$0.72/tick on avg)
# so each simulation run explores a different region of price space.
fundamental_impact_factor: 2.0
fundamental_drift_pct: 0.0003

# News shocks: doubled strength and frequency vs previous config to generate
# clearly visible price impulses on the M5 chart.
# news_shock_std=0.008 -> ~$19 shock on a $2400 price (was 0.004 -> ~$9.60)
# news_mean_arrival_ticks=150 -> news fires every ~12 min (was 300 -> ~25 min)
news_shock_std: 0.008
news_mean_arrival_ticks: 150

# Circuit breaker: trips when price deviates >circuit_breaker_pct from a
# rolling anchor that re-anchors on every closed M5 bar. At $2400 a 5% band
# halts single-bar shocks (~$120 excursion) without freezing the sim on slow
# multi-bar trends/drift.
circuit_breaker_pct: 0.05

# ============================================================
# Broker shim config
# ============================================================
# Around-mid spread offsets in price units (XAU/USD realistic spread)
spread_ask_offset: 0.30            # ask = mid + 0.30
spread_bid_offset: 0.30            # bid = mid - 0.30

# Max slippage in points applied on market orders
slippage_points: 5

# Starting virtual account balance
virtual_balance: 10000.0

# Virtual account magic number (must match MultiAssetMT5Trader.magic_number = 777111)
virtual_magic: 777111

# ============================================================
# Symbol info overrides (per-symbol; matched to mt5_symbol values from config.yaml)
# ============================================================
symbol_overrides:
  XAUUSD:
    digits: 2
    point: 0.01
    trade_stops_level: 50
    trade_freeze_level: 0
    trade_contract_size: 100.0
    volume_min: 0.01
    volume_step: 0.01
  BTCUSD:
    digits: 2
    point: 0.01
    trade_stops_level: 100
    trade_freeze_level: 0
    trade_contract_size: 1.0
    volume_min: 0.01
    volume_step: 0.01
